<html lang="en">

{{head}}

<body>
    {{header}}

    <h1 id="resource-name">Item Supplies</h1>
    <form id="instance-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <label for="color">Color:</label>
        <input type="color" id="color" name="color" required>
        <button type="submit">Add Item Supply</button>
    </form>
    <table id="roster"></table>

    {{footer}}

    <script src="/static/roster.js" data-resource="item_supplies" data-fields="id:number,name:text,color:text"></script>
</body>

</html>
