<html lang="en">

{{head}}

<body>
    {{header}}

    <h1 id="resource-name">Attributes</h1>
    <button type="button" id="dialog-trigger">Create</button>
    <dialog id="dialog">
        <header><strong>Create Attribute</strong></header>
        <form id="instance-form">
            <label for="name">Attribute Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="icon">Icon:</label>
            <select id="icon" name="icon" data-resource="icons" required></select>
            <label for="short">Short Name:</label>
            <input type="text" id="short" name="short" required>
            <label for="description">Description:</label>
            <input type="text" id="description" name="description" required>
            <div class="dialog-buttons">
                <div class="size-50">
                    <button type="submit">Submit</button>
                </div>
                <div class="size-50 float-right align-right">
                    <button type="button" id="dialog-close" class="button-secondary">Close</button>
                </div>
            </div>
        </form>
    </dialog>
    <table id="roster"></table>

    {{footer}}

    <script src="/static/roster.js" data-resource="attributes" data-fields="icon.name:icon,name:text,description:text"></script>
</body>

</html>
