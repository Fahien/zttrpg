<main id="instance-details">
    <header>
        <h1>{kin.name}</h1>
    </header>
    <p>Movement: {kin.movement}</p>
    <ul class="plain-list" data-iter="kin.skills" data-as="entry">
        <template>
            <li>
                <span class="icon-frame">
                    <span data-field="entry.icon.name:icon"></span>
                </span>
                <a href="/skills/{entry.id}"><span>{entry.name}</span></a>
            </li>
        </template>
    </ul>
</main>

<script src="/static/instance.js" data-resource="kins" data-as="kin"></script>
