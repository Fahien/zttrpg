<h1 id="resource-name">Kins</h1>
<form id="instance-form">
    <label for="name">Kin Name:</label>
    <input type="text" id="name" name="name" required>
    <label for="icon">Icon:</label>
    <select id="icon" name="icon" data-resource="icons" required></select>
    <label for="movement">Movement:</label>
    <input type="number" id="movement" name="movement" min="1" value="10" required>
    <button type="submit">Add Kin</button>
</form>
<table id="roster"></table>

<script src="/static/roster.js" data-resource="kins"
    data-fields="id:number,name:text,icon.name:icon,movement:number"></script>
