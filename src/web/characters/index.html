<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZTTRPG - Characters</title>
    <link rel="stylesheet" href="/static/water.css" type="text/css">
    <link rel="stylesheet" href="/static/custom.css" type="text/css">
</head>

<body>
    <h1 id="resource-name">Characters</h1>
    <form id="instance-form">
        <label for="name">Character Name:</label>
        <input type="text" id="name" name="name" required>
        <label for="level">Character Level:</label>
        <input type="number" id="level" name="level" min="1" max="100" value="1" required>
        <button type="submit">Add Character</button>
    </form>
    <table id="roster"></table>
</body>
<script src="/static/roster.js"
        data-resource="characters"
        data-fields="name:text,level:number"></script>

</html>
