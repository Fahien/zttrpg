<html lang="en">

{{head}}

<body>
    {{header}}

    <h1 id="resource-name">Characters</h1>

    <button type="button" id="dialog-trigger">Create</button>
    <dialog id="dialog">
        <header><strong>Create</strong></header>
        <form id="instance-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="level">Level:</label>
            <input type="number" id="level" name="level" min="1" max="100" value="1" required>
            <label for="kin">Kin:</label>
            <select id="kin" name="kin" data-resource="kins" required>
            </select>
            <label for="age">Age:</label>
            <select id="age" name="age" data-resource="ages" required>
            </select>
            <div class="dialog-buttons">
                <div class="size-50">
                    <button type="submit">Submit</button>
                </div>
                <div class="size-50 float-right align-right">
                    <button type="button" id="dialog-close" class="button-secondary">Close</button>
                </div>
            </div>
        </form>
    </dialog>

    <table id="roster"></table>

    {{footer}}

    <script src="/static/roster.js" data-resource="characters"
        data-fields="id:number,name:text,level:number,kin.name:text,age.name:text"></script>
</body>

</html>
