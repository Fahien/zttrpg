<main id="instance-details">
    <header>
        <h1 data-field="name">Name</h1>
        <p class="flex-row">
            <span class="icon-frame" data-icon-size="1"><span data-field="kin.icon.name:icon"></span></span>
            <span data-field="kin.name">Kin</span>
            <span class="icon-frame" data-icon-size="1"><span data-field="profession.icon.name:icon"></span></span>
            <span data-field="profession.name">Profession</span>
            <span class="icon-frame" data-icon-size="1"><span data-field="age.icon.name:icon"></span></span>
            <span data-field="age.name">Age</span>
        </p>
        <p id="selected-specialization" hidden>Specialization: <span></span></p>
    </header>

    <fieldset id="instance-stats">
        <legend>Stats</legend>
        <p>Level: <span data-field="level">1</span></p>
        <p>Movement: <span data-field="movement">0</span></p>

        <h3>Damage Bonus</h3>
        <ul id="damage-bonuses" class="plain-list" aria-live="polite"></ul>

        <h3>Attributes</h3>
        <!-- A callout, not an error: the player has points to spend. Hidden
                 with the rest of the stepper when the pool is empty. -->
        <section class="notice" data-requires-points hidden>
            <p>Attribute points to spend: <span data-field="attribute_points" data-quality="uncommon">0</span></p>
        </section>

        <!-- One row per attribute: the saved value, the points pending on
                 it, and the stepper that moves them. Everything that spends
                 points starts hidden and is revealed only while the character
                 still has points to spend. -->
        <ul class="plain-list" data-list="attributes">
            <template>
                <li class="flex-row" data-field="attribute.id:data-attribute-id">
                    <span class="icon-frame" data-icon-size="1"><span
                            data-field="attribute.icon.name:icon"></span></span>
                    <span class="grow" data-field="attribute.name"></span>
                    <span class="align-right tabular-nums min-width-3ch" data-field="value"></span>
                    <span class="align-right tabular-nums min-width-3ch" data-pending data-quality="uncommon"
                        data-requires-points hidden></span>
                    <button type="button" class="button-small" data-action="decrease-attribute"
                        data-field="attribute.id:data-attribute-id" data-requires-points hidden>-</button>
                    <button type="button" class="button-small" data-action="increase-attribute"
                        data-field="attribute.id:data-attribute-id" data-requires-points hidden>+</button>
                </li>
            </template>
        </ul>

        <button type="button" id="submit-attributes" data-action="submit-attributes" data-requires-points hidden>Submit
            Attributes</button>
    </fieldset>


    <fieldset id="character-creation" hidden>
        <legend>Specialization</legend>
        <section class="notice" data-requires-specialization hidden>
            <p>Choose a specialization</p>
        </section>
        <ul id="specialization-options" class="plain-list">
            <template>
                <li class="specialization-option" data-specialization-option>
                    <label><input type="radio" name="specialization"><span data-specialization-name></span></label>
                    <small data-specialization-description hidden></small>
                </li>
            </template>
        </ul>
    </fieldset>

    <fieldset id="instance-skills">
        <legend>Skills</legend>
        
        <section class="notice" data-requires-training-points hidden aria-live="polite">
            <p>Training points to spend: <span id="trained-skill-points" data-quality="uncommon">0</span></p>
            <p id="trained-skill-help"></p>
        </section>

        <p class="skill-legend"><span class="profession-skill-marker" aria-hidden="true">★</span> Profession skill</p>

        <button type="button" id="submit-creation" hidden>Submit Skills</button>
        <p id="creation-status" hidden aria-live="polite"></p>
        <section id="skill-groups" aria-live="polite"></section>
        <ul class="plain-list" data-list="skills" hidden>
            <template>
                <li class="flex-row skill-row" data-field="skill.id:data-skill-id">
                    <span class="icon-frame" data-icon-size="1"><span data-field="skill.icon.name:icon"></span></span>
                    <span class="grow" data-field="skill.name"></span>
                    <span class="align-right tabular-nums min-width-3ch" data-field="value"></span>
                    <span class="profession-skill-marker" data-specialization-skill hidden role="img"
                        aria-label="Profession skill" title="Profession skill">★</span>
                    <small data-training-state hidden></small>
                    <button type="button" class="button-small" data-action="decrease-training" hidden>-</button>
                    <button type="button" class="button-small" data-action="increase-training" hidden>+</button>
                </li>
            </template>
        </ul>
        <template id="skill-kind-template">
            <section class="skill-kind">
                <h3 data-skill-kind></h3>
                <ul class="plain-list skill-kind-list"></ul>
            </section>
        </template>
    </fieldset>
</main>

<script src="/static/instance.js" data-resource="characters"></script>
<script src="/static/characters/attributes.js"></script>
<script src="/static/characters/creation.js"></script>
