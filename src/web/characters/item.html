<html lang="en">

{{head}}

<body>
    {{header}}

    <main id="instance-details">
        <header>
            <h1 data-field="name">Name</h1>
            <p><span class="icon-frame" data-icon-size="1"><span data-field="kin.icon.name:icon"></span></span> <span data-field="kin.name">Kin icon</span></p>
        </header>

        <section id="instance-stats">
            <h2>Stats</h2>
            <ul>
                <li>Level: <span data-field="level">1</span></li>
            </ul>

            <ul data-list="attributes">
                <template>
                    <li><span class="icon-frame" data-icon-size="1"><span data-field="attribute.icon.name:icon"></span></span> <span data-field="attribute.name"></span> <span data-field="value"></span></li>
                </template>
            </ul>

        </section>
        <section id="instance-equipment">
            <h2>Equipment</h2>
        </section>
    </main>

    {{footer}}

    <script src="/static/instance.js" data-resource="characters"></script>
</body>

</html>
