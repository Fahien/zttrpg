<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZTTRPG - Character</title>
    <link rel="stylesheet" href="/static/water.css" type="text/css">
    <link rel="stylesheet" href="/static/custom.css" type="text/css">
</head>

<body>
    <section id="status-message" hidden>Status message</section>

    <main id="instance-details">
        <header>
            <h1 data-field="name">Name</h1>
        </header>

        <nav>
            <ul>
                <!-- TODO: active element? -->
                <li>Character</li>
                <li>Pets</li>
            </ul>
        </nav>

        <section id="instance-stats">
            <h2>Stats</h2>
            <ul>
                <li>Level: <span data-field="level">1</span></li>
            </ul>
        </section>
        <section id="instance-equipment">
            <h2>Equipment</h2>
        </section>
    </main>
</body>

<script src="/static/instance.js" data-resource="characters"></script>

</html>
